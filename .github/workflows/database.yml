name: Validate HallSync database
on:
  push:
    branches: [main, codex/complete-database, codex/application-connection, codex/complete-java-v1]
    paths:
      - 'database/**'
      - '.github/workflows/database.yml'
permissions:
  contents: read
jobs:
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      mysql:
        image: mysql:8.0.46
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install database test dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/pip install PyMySQL==1.1.1 argon2-cffi==25.1.0
      - name: Test schema, workflows and concurrent approvals
        env:
          HALLSYNC_TEST_HOST: 127.0.0.1
          HALLSYNC_TEST_USER: root
          HALLSYNC_TEST_PASSWORD: ''
        run: .venv/bin/python database/tests/run_checks.py
      - uses: actions/upload-artifact@v4
        with:
          name: HallSync-database-validation
          path: database/tests/database_validation.json
