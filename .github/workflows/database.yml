name: Validate HallSync database
on:
  push:
    branches: [main, codex/complete-database]
    paths:
      - 'database/**'
      - 'docs/build_database_guide.py'
permissions:
  contents: read
jobs:
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      mysql:
        image: mysql:8.0.46
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - name: Check out requested public commit
        env:
          REPO_URL: https://github.com/${{ github.repository }}.git
          REVISION: ${{ github.sha }}
        run: |
          git init .
          git remote add origin "$REPO_URL"
          git fetch --depth=1 origin "$REVISION"
          git checkout --detach FETCH_HEAD
      - name: Install pinned test and document dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/pip install PyMySQL==1.1.1 argon2-cffi==25.1.0 reportlab==4.4.3 pypdf==6.1.1 PyMuPDF==1.26.5
      - name: Test schema, workflows, and concurrent approvals
        env:
          HALLSYNC_TEST_HOST: 127.0.0.1
          HALLSYNC_TEST_USER: root
          HALLSYNC_TEST_PASSWORD: ''
        run: .venv/bin/python database/tests/run_checks.py
      - name: Build learning guide
        run: .venv/bin/python docs/build_database_guide.py
      - name: Provide reviewable document output
        run: |
          .venv/bin/python - <<'PY'
          import base64
          from pathlib import Path
          for label,name in [('GUIDE_PDF','HallSync_Complete_Database_Guide.pdf'),('GUIDE_MD','Database_Guide.md'),('VALIDATION','database_validation.json')]:
              print('ARTIFACT_'+label+'_BEGIN')
              encoded=base64.b64encode((Path('docs')/name).read_bytes()).decode('ascii')
              for start in range(0,len(encoded),2048): print('ARTIFACT_'+label+'_CHUNK '+encoded[start:start+2048])
              print('ARTIFACT_'+label+'_END')
          for label,name in [('SEED','07_demo_data.sql'),('CONTINUE_SQL','complete_existing_database.sql'),('FRESH_SQL','fresh_install.sql')]:
              print('ARTIFACT_'+label+'_BEGIN')
              encoded=base64.b64encode((Path('database')/name).read_bytes()).decode('ascii')
              for start in range(0,len(encoded),2048): print('ARTIFACT_'+label+'_CHUNK '+encoded[start:start+2048])
              print('ARTIFACT_'+label+'_END')
          for item in sorted((Path('docs')/'previews').glob('*.jpg')):
              label='PREVIEW_'+item.stem.upper()
              print('ARTIFACT_'+label+'_BEGIN')
              encoded=base64.b64encode(item.read_bytes()).decode('ascii')
              for start in range(0,len(encoded),2048): print('ARTIFACT_'+label+'_CHUNK '+encoded[start:start+2048])
              print('ARTIFACT_'+label+'_END')
          PY
      - name: Upload guide and validation report
        uses: actions/upload-artifact@v4
        with:
          name: HallSync-database-guide
          path: |
            docs/HallSync_Complete_Database_Guide.pdf
            docs/Database_Guide.md
            docs/database_validation.json
            database/complete_existing_database.sql
            database/fresh_install.sql
            database/07_demo_data.sql
            docs/previews/*.jpg
