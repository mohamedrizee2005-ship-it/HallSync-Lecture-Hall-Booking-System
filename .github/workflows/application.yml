name: Check HallSync Java application
on:
  push:
    branches: [main, release/project-cleanup]
    paths:
      - 'application/**'
      - 'database/*.sql'
      - 'database/tests/run_checks.py'
      - '.github/workflows/application.yml'
      - '.vscode/**'
      - 'run_hallsync.cmd'
permissions:
  contents: read
jobs:
  connection:
    name: Java ${{ matrix.java }} application checks
    runs-on: ubuntu-latest
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        java: ['21', '26']
    services:
      mysql:
        image: mysql:8.0.46
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
          cache-dependency-path: application/pom.xml
      - name: Build the Java classes
        run: mvn -B -ntp -f application/pom.xml clean package
      - name: Install virtual display for real Swing checks
        run: sudo apt-get update -qq && sudo apt-get install -y xvfb
      - name: Install database test helpers
        run: |
          python3 -m venv .venv
          .venv/bin/pip install PyMySQL==1.1.1 argon2-cffi==25.1.0
      - name: Test JDBC, application workflows and Swing screens
        env:
          HALLSYNC_TEST_HOST: 127.0.0.1
          HALLSYNC_TEST_USER: root
          HALLSYNC_TEST_PASSWORD: ''
        run: .venv/bin/python application/tests/connection_smoke.py
      - uses: actions/upload-artifact@v4
        with:
          name: application-validation-java-${{ matrix.java }}
          path: |
            application/target/*validation.json
            application/target/desktop-*.png
